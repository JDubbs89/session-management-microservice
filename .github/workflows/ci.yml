name: Verify API and trivia demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d integration"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://integration:isolated-test-password@127.0.0.1:5432/integration
      SECRET_KEY: isolated-ci-token-secret-at-least-32-characters
      INTEGRATION_TEST_DATABASE: "1"
      INTEGRATION_ADMIN_PASSWORD: isolated-ci-administrator-password
      SESSION_API_URL: http://127.0.0.1:8000
      RATE_LIMIT_STORAGE: postgresql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/app/requirements.txt
            src/requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: example-implementation/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r src/requirements-test.txt
          npm ci --prefix example-implementation
      - name: Dependency checks
        run: |
          python -m pip check
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r src/app/requirements.txt
          npm audit --omit=dev --audit-level=high --prefix example-implementation
      - name: Syntax and regression tests
        run: |
          python -m compileall -q src/app tests/integration
          python -m ruff check src/app src/tests tests/integration
          find example-implementation -path '*/node_modules' -prune -o -name '*.js' -exec node --check {} \;
          node --check tests/integration/live-api.mjs
          python -m pytest src/tests -q
          npm test --prefix example-implementation
      - name: Initialize an isolated database and run migrations twice
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp src/db/. "$POSTGRES_CONTAINER:/docker-entrypoint-initdb.d/"
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U integration -d integration -f /docker-entrypoint-initdb.d/init.sql
          docker cp tests/integration/check-init.sh "$POSTGRES_CONTAINER:/tmp/check-init.sh"
          docker exec "$POSTGRES_CONTAINER" bash /tmp/check-init.sh
          python tests/integration/migrations.py
          python tests/integration/legacy-p2.py
          python tests/integration/seed_admin.py
      - name: Run the live demo API contract suite
        run: |
          python -m uvicorn main:app --app-dir src/app --host 127.0.0.1 --port 8000 --no-proxy-headers > /tmp/session-api.log 2>&1 &
          echo $! > /tmp/session-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/health/ready
          node tests/integration/live-api.mjs
          python tests/integration/friendships.py
          EUCHRE_LIVE_TEST=1 DIRECTORY_ADMIN_USERNAME=integration-admin DIRECTORY_ADMIN_PASSWORD="$INTEGRATION_ADMIN_PASSWORD" node --test example-implementation/test/euchre-websocket.test.js
          python tests/integration/services.py
          python tests/integration/identity.py
          python tests/integration/release.py
          python tests/integration/load.py
          ADMIN_USERNAME=integration-admin ADMIN_PASSWORD="$INTEGRATION_ADMIN_PASSWORD" npm run operator --prefix example-implementation
      - name: PostgreSQL restart preserves accounts
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          kill "$(cat /tmp/session-api.pid)"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U integration -d integration; then break; fi
            sleep 1
          done
          python -m uvicorn main:app --app-dir src/app --host 127.0.0.1 --port 8000 --no-proxy-headers >> /tmp/session-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/health/ready
          python tests/integration/identity.py --after-restart
          node tests/integration/game-restart.mjs
          python tests/integration/identity.py --cleanup
          node tests/integration/live-api.mjs --after-restart
          TRIVIA_LIVE_TEST=1 node --test example-implementation/test/websocket.test.js
      - name: Collect API diagnostics
        if: failure()
        run: cat /tmp/session-api.log || true
