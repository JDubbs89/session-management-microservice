services:
  db:
    image: postgres:16
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data  # Persist actual DB files
      - ./db:/docker-entrypoint-initdb.d/
    ports:
      - "${DB_DEBUG_PORT:-}"

  api:
    build: ./app
    container_name: fastapi_container
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./.env

volumes:
  pgdata:  # Named Docker volume (defined at root)
